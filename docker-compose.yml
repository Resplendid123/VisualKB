networks:
  kb:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  redis_data:
  otel_lgtm_data:

services:
  # Primary DB: Postgres + ParadeDB (pgvector, pg_search)
  postgres:
    image: paradedb/paradedb:pg18
    container_name: kb-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - kb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Object storage: MinIO (S3 compatible), auto-creates bucket
  minio:
    image: minio/minio:latest
    container_name: kb-minio
    environment:
      MINIO_ROOT_USER: ${KB_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${KB_S3_SECRET_KEY}
      KB_BUCKET: ${KB_BUCKET}
    volumes:
      - minio_data:/data
    networks:
      - kb
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Init container to create bucket
  minio-init:
    image: minio/mc:latest
    container_name: kb-minio-init
    networks:
      - kb
    depends_on:
      minio:
        condition: service_healthy   # Wait for MinIO healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${KB_S3_ACCESS_KEY} ${KB_S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${KB_BUCKET} &&
      echo 'Bucket ready' &&
      exit 0
      "
    restart: "no"   # Exit after run, no restart

  # Cache, queue, session stream
  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: kb-redis
    command: ["redis-server", "--requirepass", "${KB_REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - kb
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${KB_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Observability stack: OTel, Loki, Tempo, Mimir, Grafana
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: kb-otel-lgtm
    networks:
      - kb
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - otel_lgtm_data:/data
      # Mount project dashboards; provisioning auto-loads YAMLs
      - ./deploy/grafana/llm.json:/otel-lgtm/llm.json:ro
      - ./deploy/grafana/provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/learn-dashboards.yaml:ro
    restart: unless-stopped