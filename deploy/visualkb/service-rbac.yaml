---
apiVersion: v1
kind: Service
metadata:
  name: visualkb-server
  namespace: visualkb-stack
  labels:
    app.kubernetes.io/name: visualkb
spec:
  selector:
    app.kubernetes.io/name: visualkb
  ports:
    - name: http
      port: 8889
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: visualkb-server
  namespace: visualkb-stack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: visualkb-server
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["sandbox.sandbox.io"]
    resources: ["agentsandboxes", "agentsandboxes/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: visualkb-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: visualkb-server
subjects:
  - kind: ServiceAccount
    name: visualkb-server
    namespace: visualkb-stack
